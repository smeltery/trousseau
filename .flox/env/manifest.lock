    "hook": {
      "on-activate": "  if [ ! -d \"$FLOX_ENV_PROJECT/node_modules\" ]; then\n    echo \"trousseau: installing dependencies (first activation)\u2026\" >&2\n    (cd \"$FLOX_ENV_PROJECT\" && bun install --frozen-lockfile)\n  fi\n  if [ -f \"$FLOX_ENV_PROJECT/.pre-commit-config.yaml\" ]; then\n    (cd \"$FLOX_ENV_PROJECT\" && command -v pre-commit >/dev/null && pre-commit install --install-hooks >/dev/null 2>&1 || true)\n  fi\n"
    },
    "profile": {
      "common": "  echo \"trousseau dev env (bun $(bun --version)) \u2014 bun run dev / bun run check\" >&2\n"
    },
